<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 1768" width="1290" height="1768" role="img" aria-label="Etapa 1: fronteira do sistema Correctio com os atores Professor e Aluno à esquerda e Serviço de E-mail à direita, ainda sem casos de uso."><style>
text{font-family:'Hanken Grotesk','Segoe UI',Arial,sans-serif}
.bg{fill:#ffffff}.sys{fill:#ffffff;stroke:#002045;stroke-width:1.5}
.sys-title{font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-weight:700;font-size:15px;fill:#002045}
.pkg{fill:#f8fafc;stroke:#c4c6cf;stroke-dasharray:5 4}
.pkg-title{font-size:10.5px;font-weight:700;letter-spacing:.08em;fill:#74777f}
.uc{fill:#eef3fb;stroke:#1a365d;stroke-width:1.2}.uc.internal{fill:#f1f1f1;stroke:#74777f;stroke-dasharray:4 3}
.uc.new{fill:#fff4dc;stroke:#c98a12;stroke-width:2.4}
.uc-code{font-size:10px;font-weight:700;fill:#1a365d;letter-spacing:.04em}.uc-name{font-size:11.5px;fill:#1b1c1c}
.assoc{stroke:#43474e;stroke-width:1.1;fill:none}
.rel{fill:none;stroke-width:1.2;stroke-dasharray:5 4}.rel.include{stroke:#002045}.rel.extend{stroke:#8a5a00}
.head-include{fill:#002045}.head-extend{fill:#8a5a00}
.rel-label{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#f8fafc;stroke-width:4px}
.rel-label.include{fill:#002045}.rel-label.extend{fill:#8a5a00}
.actor{fill:#ffffff;stroke:#002045;stroke-width:2}
.actor-label{font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-weight:700;font-size:12.5px;fill:#002045}
.actor-sub{font-size:10.5px;fill:#74777f}
</style><rect class="bg" width="100%" height="100%"/><defs>
<marker id="arrow-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-include" d="M0 0L10 5L0 10z"/></marker>
<marker id="arrow-extend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-extend" d="M0 0L10 5L0 10z"/></marker>
</defs><rect class="sys" x="140" y="30" width="1020" height="1708" rx="6"/>
<text class="sys-title" x="160" y="58">Sistema Correctio</text>
<g class="actor"><circle cx="70" cy="817" r="10"/><path d="M70 827V855M55 838H85M70 855L58 875M70 855L82 875"/></g><text class="actor-label" x="70" y="797" text-anchor="middle">Professor</text>
<g class="actor"><circle cx="70" cy="1651" r="10"/><path d="M70 1661V1689M55 1672H85M70 1689L58 1709M70 1689L82 1709"/></g><text class="actor-sub" x="70" y="1725" text-anchor="middle">sem login</text><text class="actor-label" x="70" y="1741" text-anchor="middle">Aluno</text>
<g class="actor"><circle cx="1228" cy="179" r="10"/><path d="M1228 189V217M1213 200H1243M1228 217L1216 237M1228 217L1240 237"/></g><text class="actor-sub" x="1228" y="253" text-anchor="middle">«sistema externo»</text><text class="actor-label" x="1228" y="269" text-anchor="middle">Serviço de E-mail</text></svg>