<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 1768" width="1290" height="1768" role="img" aria-label="Etapa 3: o Professor ganha conta, sessão, publicação, liberação e correção manual; o Aluno consulta o resultado pelo QR Code."><style>
