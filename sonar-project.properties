sonar.projectKey=PrieTorres_correctio-app
sonar.organization=prietorres

# Fonte e teste convivem na mesma pasta: test.inclusions decide o que e teste,
# e exclusions tira esses arquivos da analise de codigo de producao para nao
# indexar o mesmo arquivo duas vezes.
sonar.sources=apps/web/src
sonar.tests=apps/web/src,apps/web/cypress
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/cypress/support/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/node_modules/**,**/dist/**,**/coverage/**

# Componentes continuam sendo analisados para bugs e code smells, mas ficam
# fora da metrica de cobertura: quem os cobre e o Cypress, ponta a ponta.
# O RNF08 mede cobertura das regras criticas, e e isso que o numero reflete.
# Manter alinhado com o coverage.include do vite.config.ts.
sonar.coverage.exclusions=**/*.tsx,**/types/**,**/seed/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.sourceEncoding=UTF-8
