sonar.projectKey=PrieTorres_correctio-app
sonar.organization=prietorres

# Sources and tests share a folder: test.inclusions decides what counts as a
# test, and exclusions keeps those files out of the production analysis so the
# same file is never indexed twice. Everything under __tests__ is test code,
# helpers and fixtures included, as coverage.exclude says in every vitest
# config; counted as sources, a helper shows 0% coverage and fails the gate.
# packages/domain holds the schemas both sides validate with, so it is analysed
# and measured like the web app, and so is apps/api.
sonar.sources=apps/web/src,packages/domain/src,packages/sheet-reader/src,apps/api/src
sonar.tests=apps/web/src,apps/web/cypress,packages/domain/src,packages/sheet-reader/src,apps/api/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/cypress/support/**,**/__tests__/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/__tests__/**,**/node_modules/**,**/dist/**,**/coverage/**

# Components stay under analysis for bugs and smells but sit outside the
# coverage metric: Cypress covers them end to end. RNF08 measures coverage of
# the critical rules, and that is what this number reflects.
# Keep aligned with coverage.include and coverage.exclude in vite.config.ts
# (the re-export index.ts files, types.ts and the test setup). The API entry points
# and migrations follow coverage.exclude in apps/api/vitest.config.ts: if the
# two lists differ, the gate fails with the whole suite green.
sonar.coverage.exclusions=**/*.tsx,**/types/**,**/*.d.ts,apps/web/src/**/index.ts,apps/web/src/**/types.ts,apps/web/src/test-setup.ts,apps/api/src/server.ts,apps/api/src/function.ts,apps/api/src/db/migrate.ts,apps/api/src/db/migrations/**

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,packages/domain/coverage/lcov.info,packages/sheet-reader/coverage/lcov.info,apps/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
