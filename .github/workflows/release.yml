name: Release do dia

# Manual, in three stages: the quality gate, then production, then the tag.
# Anyone on the team can start it, but the publish job runs in the production
# environment, whose required reviewer is the PM: nothing reaches production or
# becomes a version until she approves the run. The tag is created last, so a
# version number always means "this is what production is running".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer, sem o "v". Exemplos: 1.1.0, 2.0.0'
        required: true
        type: string

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real MySQL for the schema test, as in the pull request gate: the release
    # runs the same tests and would fail without it.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_TEST_URL: mysql://root:root@127.0.0.1:3306
    steps:
      # The guards run before anything else. Finding out the input was wrong
      # after a full minute of lint, tests and build wastes the run and hides
      # the real reason at the bottom of a long log.
      # Inputs reach the shell through the environment, never through direct
      # interpolation: a value pasted into the script would run as part of it.
      - name: Validar a versão
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'"
            echo "::error::Use o formato MAIOR.MENOR.CORREÇÃO, por exemplo 1.1.0 ou 2.0.0, sem o 'v'."
            exit 1
          fi

      - name: Exigir a branch principal
        if: ${{ github.ref_name != 'main' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::Release sai da main, e esta execução foi disparada em '$BRANCH'."
          echo "::error::Marcar uma branch de feature criaria uma tag que some quando a branch for apagada."
          exit 1

      - name: Recusar versão já lançada
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::A versão v$VERSION já existe. Para publicar de novo em produção, use o workflow Republish a version."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A release only leaves a state that passes the quality gate.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Waits for the PM's approval: the production environment requires her as
  # reviewer. The exact commit that passed the gate is what gets published.
  publish:
    name: Publish to production
    needs: gate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.sha }}
    secrets: inherit

  # Only after production answered 200. The tag is created through the API on
  # the published commit, never pushed: main only takes changes through a pull
  # request, and the version lives in the tag, not in package.json. Notes come
  # from the PRs merged since the previous tag, grouping what the whole team
  # delivered in that period.
  release:
    name: Tag and release notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          URL: ${{ needs.publish.outputs.url }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --generate-notes --title "v$VERSION"
          echo "### v$VERSION em produção: $URL" >> "$GITHUB_STEP_SUMMARY"
