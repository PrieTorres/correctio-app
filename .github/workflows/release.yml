name: Release do dia

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer, sem o "v". Exemplos: 0.2.0, 1.0.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A real MySQL for the schema test, as in the pull request gate: the release
    # runs the same tests and would fail without it.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_TEST_URL: mysql://root:root@127.0.0.1:3306
    steps:
      # Both guards run before anything else. Finding out the input was wrong
      # after a full minute of lint, tests and build wastes the run and hides
      # the real reason at the bottom of a long log.
      # Inputs reach the shell through the environment, never through direct
      # interpolation: a value pasted into the script would run as part of it.
      - name: Validar a versão
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'"
            echo "::error::Use o formato MAIOR.MENOR.CORREÇÃO, por exemplo 0.2.0 ou 1.0.0, sem o 'v'."
            exit 1
          fi

      - name: Exigir a branch principal
        if: ${{ github.ref_name != 'main' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::Release sai da main, e esta execução foi disparada em '$BRANCH'."
          echo "::error::Marcar uma branch de feature criaria uma tag que some quando a branch for apagada."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A release only leaves a state that passes the quality gate.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Fixar a versão nos manifestos
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --workspaces --include-workspace-root

      - name: Commitar e marcar
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD --follow-tags

      # Notes come from the PRs merged since the previous tag, grouping what
      # the whole team delivered in that period.
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"

  # Production only ever receives a numbered version. A failed publication
  # leaves the release in place; "Republish a version" retries it.
  publish:
    name: Publish to production
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: v${{ inputs.version }}
    secrets: inherit
