name: Portão de qualidade

on:
  pull_request:
    branches: [main]

# Cancels superseded runs of the same PR: without it, every push queues a new
# run while the previous one is still going.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: without it Sonar cannot tell which code is new and
          # falls back to grading the whole repository, failing everything.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes unitários com cobertura
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist
          retention-days: 3

  e2e:
    name: Cypress
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # E2E runs against the production build, not the dev server: that is
      # where the real problems show up.
      - run: npm run build
      # Records to Cypress Cloud when a key exists, but the gate cannot depend
      # on an external service: without the key it still runs and passes.
      - name: Testes E2E
        run: |
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            npm run test:e2e:record
          else
            npm run test:e2e
          fi
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: verificar
    # Only runs where the secret exists, so a PR from a fork does not fail for
    # a reason its author cannot fix.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
