name: Publicar pré-visualização da branch

on:
  workflow_dispatch:

# One preview per branch, replaced on each run.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derivar o nome da pasta
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd '[:alnum:]-_')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The gate runs before publishing: a preview of code that does not build
      # is a link that wastes whoever opens it.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/previews/${{ steps.slug.outputs.value }}/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          destination_dir: previews/${{ steps.slug.outputs.value }}
          commit_message: 'preview: ${{ github.ref_name }}'

      - name: Resumo
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${{ steps.slug.outputs.value }}/"
          {
            echo "### Pré-visualização publicada"
            echo ""
            echo "$URL"
            echo ""
            echo "Leva cerca de um minuto para o GitHub Pages servir a versão nova."
          } >> "$GITHUB_STEP_SUMMARY"
