name: "1. Pre-release: publish to pre-production"

# The pre-version of the day: publishes main (or any branch) to the
# pre-production Firebase project, with its own database, so the release can be
# tried on a real link before it reaches production. The publish job waits for
# the PM, the required reviewer of the preview environment: the pre-production
# API and database are shared, and only one version at a time can be on them.
# Each branch gets its own address; the API is the one of the last published.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch ou número do PR para publicar na pré-produção. Exemplos: feat/class-routes ou 98'
        required: true
        type: string

jobs:
  channel:
    name: Channel name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.branch.outputs.ref }}
      id: ${{ steps.slug.outputs.id }}
    steps:
      # People think in pull requests, so a number is taken as the PR and turned
      # into its branch. Checking that the branch exists here gives a message
      # saying what is wrong, instead of a failed checkout minutes later.
      - id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.ref }}
        run: |
          branch="$INPUT"
          if [[ "$INPUT" =~ ^#?[0-9]+$ ]]; then
            number="${INPUT#\#}"
            if ! branch=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName); then
              echo "::error::O PR #$number não existe."
              exit 1
            fi
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent; then
            echo "::error::A branch '$branch' não existe (ou já foi apagada no merge). Informe o nome da branch, como feat/class-routes, ou o número de um PR aberto, como 98."
            exit 1
          fi
          echo "ref=$branch" >> "$GITHUB_OUTPUT"

      # The day's release goes to the fixed address of pre-production (the live
      # channel), the one Google sign-in accepts and the team tests the day on.
      # Any other branch gets a channel of its own. A channel name is lowercase
      # letters, digits and hyphens, short enough to fit in the address Firebase
      # builds from it.
      - id: slug
        env:
          REF: ${{ steps.branch.outputs.ref }}
        run: |
          if [[ "$REF" == release/* ]]; then
            echo "id=live" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-30 | sed -E 's/-+$//')
          if [ -z "$id" ] || [ "$id" = live ]; then
            echo "::error::A branch '$REF' não vira um nome de canal válido."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: channel
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      ref: ${{ needs.channel.outputs.ref }}
      channel: ${{ needs.channel.outputs.id }}
    secrets: inherit

  comment:
    name: Link in the pull request
    needs: [channel, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.channel.outputs.ref }}
          URL: ${{ needs.publish.outputs.url }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REF" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "Sem PR aberto para $REF: o link está no resumo da execução."
            exit 0
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
            --body "Link de pré-produção de \`$REF\`: $URL (expira em 7 dias; a API é a da última branch publicada)."
