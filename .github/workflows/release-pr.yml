name: Release pull request

# Keeps the pull request of the day's release into main up to date. GitHub only
# closes an issue when its pull request merges into main, so the pull requests
# merged into release/YYYY-MM-DD close nothing; the release pull request lists
# their "Closes #N" lines instead, and merging it into main closes them all.
on:
  pull_request:
    types: [closed]
    branches: ['release/**']

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  sync:
    name: List the day's pull requests
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.base.ref;
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base: 'main', state: 'open' });
            const release = open[0];
            if (!release) {
              core.notice(`O PR de ${branch} para a main ainda não foi aberto. Abra-o e este workflow passa a mantê-lo.`);
              return;
            }

            const search = await github.graphql(
              'query($q: String!) { search(query: $q, type: ISSUE, first: 100) { nodes { ... on PullRequest { number title body } } } }',
              { q: `repo:${owner}/${repo} is:pr is:merged base:${branch}` },
            );
            const merged = search.search.nodes.sort((a, b) => a.number - b.number);
            const closes = [...new Set(merged.flatMap((pr) =>
              [...(pr.body || '').replace(/<!--[\s\S]*?-->/g, '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => +m[1]),
            ))].sort((a, b) => a - b);

            const replace = (text, name, content) => {
              const start = `<!-- ${name}:start -->`;
              const end = `<!-- ${name}:end -->`;
              const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
              const block = `${start}\n${content}\n${end}`;
              return pattern.test(text) ? text.replace(pattern, block) : `${text}\n\n${block}`;
            };
            let body = release.body || '';
            body = replace(body, 'release-issues', closes.map((n) => `Closes #${n}`).join('\n'));
            body = replace(body, 'release-prs', merged.map((pr) => `- #${pr.number} ${pr.title}`).join('\n'));
            if (body !== release.body) await github.rest.pulls.update({ owner, repo, pull_number: release.number, body });

            // An edit made with this token starts no workflow, so the delivery
            // check of the release pull request is re-run by hand.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'delivery-rules.yml', head_sha: release.head.sha, per_page: 1,
            });
            const run = runs.workflow_runs[0];
            if (run?.status === 'completed') await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
