name: Redirect GitHub Pages to Firebase

# The address delivered in N1 lives on GitHub Pages. This replaces that site
# with a page that sends every old link to the same path on Firebase. Run it
# once, after the first release is live on Firebase: before that it would send
# people to an empty site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # GitHub Pages answers an unknown path with 404.html, so the same page
      # catches deep links such as /correctio-app/r/ABC123.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp tooling/pages-redirect/index.html site/index.html
          cp tooling/pages-redirect/index.html site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
