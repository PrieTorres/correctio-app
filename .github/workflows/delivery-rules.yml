name: Delivery rules

# The rules live in scripts/delivery-rules, where node:test covers them.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  delivery:
    name: Issue, checklist and video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/delivery-rules
      - uses: actions/github-script@v8
        with:
          script: |
            const { closingReferences, deliveryErrors, isReleasePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/delivery-rules/delivery-verdict.mjs`
            );
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const body = pr.body ?? '';
            const issues = isReleasePullRequest(pr.head.ref)
              ? []
              : await Promise.all(
                  closingReferences(body).map(async (number) => {
                    const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
                    return { number, body: issue.body ?? '' };
                  }),
                );
            const errors = deliveryErrors({ body, labels: pr.labels.map((label) => label.name), headRef: pr.head.ref, issues });
            if (errors.length > 0) core.setFailed(errors.join('\n'));
