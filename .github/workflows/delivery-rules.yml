name: Delivery rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  delivery:
    name: Issue, checklist and video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const errors = [];
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => +m[1]);
            if (!refs.length) errors.push('Ligue a issue no corpo do PR com "Closes #N".');
            if (/- \[ \]/.test(body)) errors.push('Há itens não marcados no checklist do PR.');
            const video = /(github\.com\/user-attachments\/assets\/|\.(mp4|mov|webm)\b|loom\.com\/share|drive\.google\.com|youtu\.?be)/i;
            const noCodeChange = context.payload.pull_request.labels.some(l => ['docs','infra','process','qa','ux','po'].includes(l.name));
            if (!noCodeChange && !video.test(body)) errors.push('Anexe o vídeo do teste (upload no PR ou link Drive/Loom/YouTube).');
            for (const n of refs) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n });
              const b = issue.body || '';
              const total = (b.match(/- \[[ xX]\]/g) || []).length;
              const unchecked = (b.match(/- \[ \]/g) || []).length;
              if (!total) errors.push(`Issue #${n} não tem checklist.`);
              else if (unchecked) errors.push(`Issue #${n} tem ${unchecked} item(ns) do checklist sem marcar.`);
            }
            if (errors.length) core.setFailed(errors.join('\n'));
