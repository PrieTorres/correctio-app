name: "0. Start the day's release"

# Opens the day's release branch, release/YYYY-MM-DD, from main. Every pull
# request of the day targets it instead of main; the PM tests it on the fixed
# pre-production link ("1. Pre-release") and, at the end of the day, merges it
# into main and runs "2. Release". Started by hand, when the PM decides.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Data da release, AAAA-MM-DD. Vazio usa a data de hoje em São Paulo.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  branch:
    name: Create the release branch
    runs-on: ubuntu-latest
    steps:
      - name: Create release/<date> from main
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          day="${INPUT_DATE:-$(TZ=America/Sao_Paulo date +%F)}"
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Data inválida: '$day'. Use AAAA-MM-DD."
            exit 1
          fi
          branch="release/$day"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "::error::A branch $branch já existe."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" --silent
          {
            echo "### \`$branch\` aberta a partir da \`main\`"
            echo ""
            echo "Os PRs do dia apontam para ela. O PR da release para a \`main\` abre quando o primeiro PR do dia entrar."
          } >> "$GITHUB_STEP_SUMMARY"
