name: Task
description: Backlog item — small, testable, with an owner
title: "[area] "
labels: [N2]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: O que e por quê. Cite RF/RNF e telas envolvidas.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist de aceite
      description: Cada item é conferido no vídeo do teste. O que só se cumpre depois do merge vai sob um título "Depois do merge", que o check do PR não cobra. Sem checklist a issue recebe o label missing-checklist.
      value: |
        - [ ] 
        - [ ] Testes automatizados do caso principal
    validations:
      required: true
  - type: input
    id: due-date
    attributes:
      label: Prazo (AAAA-MM-DD)
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depende de
      placeholder: "#12, #13"
